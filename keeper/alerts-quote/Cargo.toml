# The Friday alerts' pricing helper (C4a.2): the program's own pricing for any covered xStock, off-chain. A standalone
# workspace so it builds against credence-core without changing the program's workspace.
[package]
name = "alerts-quote"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "alerts_quote"
path = "src/main.rs"

[dependencies]
credence-core = { path = "../../programs/credence-core", features = ["no-entrypoint"] }
credence-risk-core = { path = "../../crates/risk-core" }
anchor-lang = "1.2.1"
bytemuck = "1"
serde_json = "1"

[workspace]

[profile.release]
overflow-checks = true
