[workspace]
resolver = "2"
members = ["crates/risk-core", "programs/*"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
alloy-primitives = { version = "1.7.3", default-features = false }
serde_json = "1"
proptest = "1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
