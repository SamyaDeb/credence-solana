[package]
name = "credence-risk-core"
description = "Credence risk math: no_std fixed-point core shared by the on-chain program, backtest and data tools"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = []
std = []                 # native builds enable std; the on-chain program does not
files = ["std", "dep:serde_json", "dep:sha2"] # scenario-set / joint-set / bundle files; never on chain

[dependencies]
alloy-primitives = { workspace = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.10.9", optional = true }

[dev-dependencies]
proptest = { workspace = true }
